# Prices of the AI models the app knows (US$ per million tokens), read from each provider's official pricing page.
# Edited by pull request; the user can override a price or add a model in Configurações → IA
# (settings.ai_price_overrides). A row older than 90 days shows "conferir preço". Output prices include thinking.
#
# effort_param: how the app's effort levels are sent (anthropic | openai | gemini | deepseek | none).
# thinking_off: how "mínimo" turns thinking off (disabled | between_tools | none | "" = can't be turned off).
# max_tokens_includes_thinking: yes | no | unverified (unverified → the pre-call estimate reserves twice the cap).
# Tiers override the base price when they apply: by prompt size (min_prompt_tokens), by date (valid_from) or by UTC
# time windows (utc_windows + weekdays). The estimate always takes the most expensive price that could apply.
schema = 1

