[package]
name = "leitor-estudos"
description = "Leitor de Estudos: PDF/EPUB reader with the Anki core inside"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "leitor_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Release builds with the debug bridge probe (LEITOR_BRIDGE_PROBE) and `dev_log`, to time the shipped
# frontend (embedded PdfCraft) in the real webview. Never in a shipped build.
bridge-probe = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
core-anki.workspace = true
core-pdf.workspace = true
core-epub.workspace = true
core-vocab.workspace = true
core-store.workspace = true
core-ai.workspace = true
core-libsync.workspace = true
# Code cards (spec 11): HTML <-> code, the Markdown importer; C++ local (desktop) and remote runner.
core-code.workspace = true
core-cpp.workspace = true
# Same version as Anki's (one libsqlite3-sys); only for `Store::connection` reads.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# `leitor://livro/<uid>?pagina=N&q=…` links opened by the OS (spec 10.2). MIT OR Apache-2.0. Also the iOS path later.
tauri-plugin-deep-link = "2.4"
base64 = "0.22"
percent-encoding = "2.3"
chrono.workspace = true
# Job ids (spec 15 `job://<id>`) and the sentence starts of a page for the vocabulary marks (spec 12.7).
uuid.workspace = true
unicode-segmentation.workspace = true
# Already in the graph through Anki; `_SVELTEKIT_CSP_META_RE` of mediasrv.py, verbatim.
regex = "1.11"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# `deep-link`: a second launch with a `leitor://` URL is handed to the deep-link plugin of the running app.
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK settings of the main webview (WebGL for the embedded PdfCraft, spec 22).
webkit2gtk = "2.0"
# The sync key (hkey) lives in the system keychain (spec 18): Secret Service on Linux, pure-Rust
# crypto for the session (no OpenSSL). MIT OR Apache-2.0.
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

# macOS and iOS: the Keychain (keeps the iOS door open, docs/decisoes.md).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile.workspace = true
# The offline test's TCP proxy (tests/sync.rs).
tokio = { workspace = true, features = ["net"] }
# The fake AI provider of tests/ai.rs (already in the lock through core-ai's tests).
axum = "0.8"
# The real library server, in process, for tests/library_sync.rs (its own workspace; same rusqlite).
leitor-library-sync = { path = "../../server/library-sync" }
# Synthetic PDFs for the integration tests (spec 20); nothing large is committed.
pdfcraft-testkit.workspace = true
pdfcraft-cos.workspace = true
pdfcraft-organize.workspace = true
# The scanned-PDF generator of the OCR tests and the EPUB builders of the EPUB tests (spec 20, generated in code).
core-pdf = { workspace = true, features = ["testkit"] }
core-epub = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
