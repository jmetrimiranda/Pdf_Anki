[package]
name = "spike-leitor-anki"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anki = { path = "<caminho>/anki/rslib" }
anki_proto = { path = "<caminho>/anki/rslib/proto" }
pdfcraft-render = { path = "<caminho>/pdfcraft/crates/render" }
png = "0.17"
anyhow = "1"
# rslib relies on tokio features that Anki's own workspace unifies in; enable them here.
tokio = { version = "1.45", features = ["fs", "rt-multi-thread", "macros", "signal", "io-util"] }

# Copied from pdfcraft's workspace: its engine depends on these patched forks.
[patch.crates-io]
hayro-interpret = { path = "<caminho>/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "<caminho>/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "<caminho>/pdfcraft/vendor/hayro-syntax" }
hayro-cmap = { path = "<caminho>/pdfcraft/vendor/hayro-cmap" }
hayro-jbig2 = { path = "<caminho>/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "<caminho>/pdfcraft/vendor/lopdf" }
vello_common = { path = "<caminho>/pdfcraft/vendor/vello_common" }

[workspace]
