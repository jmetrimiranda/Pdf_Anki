[package]
name = "leitor-runner"
description = "Leitor de Estudos: isolated C++ runner for code cards (spec 11.5). Standalone, not part of src-tauri."
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
publish = false

# Its own workspace: never a member of src-tauri's, no Anki dependencies.
[workspace]

[lib]
name = "leitor_runner"
path = "src/lib.rs"

[[bin]]
name = "runner"
path = "src/main.rs"

# MIT / Apache-2.0 only.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1.45", features = ["rt", "macros", "net", "process", "time", "sync", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", default-features = false, features = ["signal", "user"] }
http-body-util = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
