name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml reuses these jobs, so a release is only drafted from a fully tested build.
  workflow_call:
  # Manual runs only. The project targets Linux + Web (docs/decisoes.md, 2026-10-23); the Windows job
  # never runs on push, PR or release — only when started by hand with "windows" ticked.
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the (unsupported) Windows build
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PROTOC_VERSION: "31.1"
  # PdfCraft web toolchain (docs/PROJETO.md 3.2 and 19); the Linux job gets the same versions from the dev image.
  TRUNK_VERSION: "0.22.0"
  TRUNK_WIN_SHA256: 4a9c5f1967e5563b277802186a836fd6f95fb455a8d4a0c1ed15cc8437187690
  WASM_BINDGEN_VERSION: "0.2.129"
  WASM_BINDGEN_WIN_SHA256: 79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6
  BINARYEN_VERSION: "131"
  BINARYEN_WIN_SHA256: 2f4edac1703a2f695254d6ff52ede03481e67db1f094915763d863158c17d9bc
  # The Tauri CLI is run from web/, which doesn't contain the Tauri crate.
  TAURI_APP_PATH: ../src-tauri/app

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - name: Cache Pyodide
        # scripts/fetch-pyodide.sh pins the version and sha256; a hit leaves it with nothing to do (its stamp matches).
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/pyodide
          key: pyodide-${{ hashFiles('scripts/fetch-pyodide.sh') }}
      - name: Pyodide (Python code cards; the harness tests and e2e:mock run the real interpreter)
        run: scripts/fetch-pyodide.sh
      - run: pnpm -r test
      - name: Anki web assets
        # The mocked card frame then uses the real reviewer.js and MathJax (vite-plugin-anki-card), not the stub.
        run: scripts/fetch-anki-web.sh
      - name: Playwright (mocked core)
        run: |
          pnpm --dir web exec playwright install --with-deps chromium webkit
          pnpm --dir web e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  linux:
    # Same image as the devcontainer, so CI and local builds match.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        # Debug + release builds of the Anki core and PdfCraft need more than the runner's ~14 GB free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - name: PdfCraft submodule commit
        id: pdfcraft
        run: echo "commit=$(git rev-parse HEAD:third_party/pdfcraft)" >> "$GITHUB_OUTPUT"
      - name: Cache PdfCraft web build
        # Keyed by the fork commit: a hit leaves scripts/build-pdfcraft-web.sh with nothing to do (its stamp matches).
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/pdfcraft-web
            src-tauri/resources/pdfcraft-web
          key: pdfcraft-web-linux-${{ hashFiles('.gitmodules') }}-${{ steps.pdfcraft.outputs.commit }}
          restore-keys: pdfcraft-web-linux-
      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/pyodide
          key: pyodide-${{ hashFiles('scripts/fetch-pyodide.sh') }}
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: leitor-dev:latest
          load: true
          cache-from: type=gha,scope=leitor-dev
          cache-to: type=gha,scope=leitor-dev,mode=max
      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            src-tauri/target/debug
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-cargo-
      - name: Anki sync dev server
        # Official sync server at the pinned Anki version + TLS terminator with a dev CA (compose.dev.yml, network
        # leitor-dev); the gated sync tests below only ever talk to it (docs/tecnico/anki-sync-dev.md).
        run: |
          scripts/ankisync-dev-certs.sh
          docker compose -f compose.dev.yml up -d --build --wait
          test "$(docker compose -f compose.dev.yml exec -T ankisync-dev python -c 'import importlib.metadata as m; print(m.version("anki"))')" = 26.9.3
      - name: C++ runner (local, isolated)
        # server/runner behind the "runner" profile: only on the internal network, reached through its Caddy proxy on
        # leitor-dev (docs/tecnico/runner.md). The gated core-cpp isolation suite and the app's runner test use it.
        run: |
          docker compose -f compose.dev.yml --profile runner up -d --build --wait runner-dev runner-dev-proxy
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose -f compose.dev.yml --profile runner ps -q runner-dev)")" = true
          test "$(docker network inspect -f '{{.Internal}}' leitor-runner-internal)" = true
      - name: PdfCraft web, fmt, clippy, test, bridge e2e, bundle (in the dev image)
        # The image's user is dev (uid 1000) but the runner checks out as uid 1001, so run as root;
        # root-owned outputs stay readable for the cache and artifact steps.
        run: |
          mkdir -p ~/cargo-registry ~/cargo-git
          docker run --rm --ulimit core=0 --user 0 -e HOME=/root --network leitor-dev \
            -e CARGO_INCREMENTAL -e CARGO_TERM_COLOR -e TAURI_APP_PATH -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -e LEITOR_SYNC_TEST_URL=http://ankisync-dev:8080/ -e LEITOR_SYNC_TEST_TLS_URL=https://ankisync-dev-tls:8443/ \
            -e LEITOR_SYNC_TEST_CA=/workspaces/leitor-estudos/server/ankisync-dev/certs/ca.crt \
            -e LEITOR_SYNC_TEST_UNTRUSTED_CA=/workspaces/leitor-estudos/server/ankisync-dev/certs/untrusted-ca.crt \
            -v "$PWD":/workspaces/leitor-estudos \
            -v ~/cargo-registry:/usr/local/cargo/registry -v ~/cargo-git:/usr/local/cargo/git \
            -w /workspaces/leitor-estudos leitor-dev:latest bash -c '
              set -euo pipefail
              git config --global --add safe.directory "*"
              scripts/fetch-anki-web.sh
              scripts/fetch-ocr-models.sh
              scripts/fetch-pyodide.sh
              # trunk build --release of the fork (also compiles pdfcraft-web for wasm32, i.e. the fork check)
              CARGO_BUILD_JOBS=2 timeout 40m scripts/build-pdfcraft-web.sh
              pnpm install --frozen-lockfile
              cd src-tauri
              cargo fmt --all --check
              cargo clippy -j 2 --workspace --all-targets -- -D warnings
              # Private D-Bus + unlocked gnome-keyring: the keychain and sync tests run against the dev server.
              timeout 75m ../scripts/with-keyring.sh cargo test -j 2 --workspace
              # C++ runner isolation suite + the app runner test, serially (the runner takes one run at a time).
              export LEITOR_RUNNER_TEST_URL=http://runner-dev-proxy:8080 LEITOR_RUNNER_TEST_TOKEN=dev-runner-token
              cargo test -j 2 -p core-cpp --test remote -- --test-threads=1
              cargo test -j 2 -p leitor-estudos --test code remote -- --test-threads=1
              unset LEITOR_RUNNER_TEST_URL LEITOR_RUNNER_TEST_TOKEN
              cd ..
              # Bridge tests against the real PdfCraft web build (browsers are in the image; software WebGL via Mesa)
              pnpm --dir web exec playwright install chromium webkit
              timeout 20m xvfb-run -a pnpm --dir web e2e:bridge
              # Real app (WebKitGTK under Xvfb) with the fixture collection: card iframe isolation (spec 8.4)
              # and the Anki pages over the anki protocol (deck options, statistics, card info…).
              CARGO_BUILD_JOBS=2 timeout 30m scripts/anki-real-app.sh isolation
              timeout 20m scripts/anki-real-app.sh pages
              pnpm --dir web tauri build --bundles deb,appimage
            '
      - name: Official Anki client cross-check (pyclient.py against the dev server)
        run: |
          docker compose -f compose.dev.yml exec -T ankisync-dev python /opt/ankisync/pyclient.py \
            --url http://ankisync-dev:8080/ --user t11 --password test --dir /tmp/pyclient-a seed-upload
          docker compose -f compose.dev.yml exec -T ankisync-dev python /opt/ankisync/pyclient.py \
            --url http://ankisync-dev:8080/ --user t11 --password test --dir /tmp/pyclient-b review-first-due
          docker compose -f compose.dev.yml exec -T ankisync-dev python /opt/ankisync/pyclient.py \
            --url http://ankisync-dev:8080/ --user t11 --password test --dir /tmp/pyclient-c download-and-report \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d); assert d["revlogCount"] == 1 and "leitor-crosscheck.png" in d["mediaFiles"]'
          docker compose -f compose.dev.yml exec -T ankisync-dev python /opt/ankisync/pyclient.py \
            --url http://ankisync-dev:8080/ --user t12 --password test --dir /tmp/pyclient-d download-and-report
      - name: Stop C++ runner
        if: always()
        run: |
          docker compose -f compose.dev.yml --profile runner logs --tail 30 runner-dev runner-dev-proxy || true
          docker compose -f compose.dev.yml --profile runner rm -sfv runner-dev runner-dev-proxy || true
      - name: Stop Anki sync dev server
        if: always()
        run: |
          docker compose -f compose.dev.yml logs --tail 30 || true
          docker compose -f compose.dev.yml down -v --remove-orphans || true
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/cargo-registry
            ~/cargo-git
            src-tauri/target/debug
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-bridge-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    # Not part of the supported CI (Linux + Web). Manual only; failures here are not fixed.
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Allow long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: protoc ${{ env.PROTOC_VERSION }}
        shell: pwsh
        run: |
          $u = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-win64.zip"
          Invoke-WebRequest $u -OutFile "$env:RUNNER_TEMP\protoc.zip"
          Expand-Archive "$env:RUNNER_TEMP\protoc.zip" -DestinationPath "$env:RUNNER_TEMP\protoc"
          "PROTOC=$env:RUNNER_TEMP\protoc\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$env:RUNNER_TEMP\protoc\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: PdfCraft web toolchain (trunk, wasm-bindgen, wasm-opt)
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/pdfcraft-tools"
          mkdir -p "$tools" && cd "$RUNNER_TEMP"
          fetch() { curl -fsSL -o "$1" "$2" && echo "$3  $1" | sha256sum -c -; }
          fetch trunk.zip "https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION/trunk-x86_64-pc-windows-msvc.zip" "$TRUNK_WIN_SHA256"
          unzip -o -q trunk.zip trunk.exe -d "$tools"
          wb="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-pc-windows-msvc"
          fetch wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$wb.tar.gz" "$WASM_BINDGEN_WIN_SHA256"
          tar -xzf wb.tar.gz "$wb/wasm-bindgen.exe" && mv "$wb/wasm-bindgen.exe" "$tools/"
          bn="binaryen-version_$BINARYEN_VERSION"
          fetch bn.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$bn-x86_64-windows.tar.gz" "$BINARYEN_WIN_SHA256"
          tar -xzf bn.tar.gz "$bn/bin/wasm-opt.exe" && mv "$bn/bin/wasm-opt.exe" "$tools/"
          cygpath -w "$tools" >> "$GITHUB_PATH"
      - name: PdfCraft submodule commit
        id: pdfcraft
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:third_party/pdfcraft)" >> "$GITHUB_OUTPUT"
      - name: Cache PdfCraft web build
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/pdfcraft-web
            src-tauri/resources/pdfcraft-web
          key: pdfcraft-web-windows-${{ hashFiles('.gitmodules') }}-${{ steps.pdfcraft.outputs.commit }}
          restore-keys: pdfcraft-web-windows-
      - name: Build PdfCraft web
        shell: bash
        timeout-minutes: 40
        env: { CARGO_BUILD_JOBS: "2" }
        run: scripts/build-pdfcraft-web.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fetch bundled assets
        # Git Bash on the runner has curl, sha256sum and Python.
        shell: bash
        run: |
          scripts/fetch-anki-web.sh
          scripts/fetch-ocr-models.sh
      - name: Test core
        working-directory: src-tauri
        run: cargo test -j 2 --workspace
      - name: Bundle (.msi)
        # MSVC, the Windows SDK and WebView2 are preinstalled; the Tauri CLI downloads WiX itself.
        run: pnpm --dir web tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
