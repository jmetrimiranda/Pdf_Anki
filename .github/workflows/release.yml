name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # The full CI (tests included) builds the PdfCraft web build (scripts/build-pdfcraft-web.sh) and then the Linux
    # and Windows bundles, which embed it under /pdfcraft/.
    uses: ./.github/workflows/ci.yml

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find dist -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' \))
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Leitor de Estudos $TAG" --generate-notes
