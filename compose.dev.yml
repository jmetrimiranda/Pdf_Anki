# Local Anki sync server for development and tests ONLY (docs/tecnico/anki-sync-dev.md).
# Official server (python -m anki.syncserver) at the pinned Anki version (spec A.1: 26.9.3) + a TLS terminator with a
# dev certificate (scripts/ankisync-dev-certs.sh). Never point the app at any other server in tests.
#   scripts/ankisync-dev-certs.sh
#   docker compose -f compose.dev.yml up -d --build --wait
#   LEITOR_DEV_NETWORK=leitor-dev scripts/dev.sh …   (reach it as ankisync-dev:8080 / ankisync-dev-tls:8443)
#   docker compose -f compose.dev.yml down -v          (removes the data volume)
# The C++ runner (server/runner, docs/tecnico/runner.md) is behind the "runner" profile, so the commands above (and
# scripts/sync-test.sh) never start it:
#   docker compose -f compose.dev.yml --profile runner up -d --build --wait runner-dev runner-dev-proxy
#   scripts/runner-test.sh                             (isolation suite; removes both containers at the end)
name: leitor-dev

x-test-password: &pw test

services:
  ankisync-dev:
    ulimits:
      core: 0  # no core dumps on the host (kernel core_pattern is global; docs/decisoes.md)
    build:
      context: server/ankisync-dev
      args:
        ANKI_VERSION: "26.9.3"
    image: leitor-ankisync-dev:26.9.3
    environment:
      # Throwaway local test accounts (spec A.2). test:test is the manual account; t1..t14 are one per test.
      SYNC_USER1: "test:test"
      SYNC_USER2: "t1:test"
      SYNC_USER3: "t2:test"
      SYNC_USER4: "t3:test"
      SYNC_USER5: "t4:test"
      SYNC_USER6: "t5:test"
      SYNC_USER7: "t6:test"
      SYNC_USER8: "t7:test"
      SYNC_USER9: "t8:test"
      SYNC_USER10: "t9:test"
      SYNC_USER11: "t10:test"
      SYNC_USER12: "t11:test"
      SYNC_USER13: "t12:test"
      SYNC_USER14: "t13:test"
      SYNC_USER15: "t14:test"
      RUST_LOG: "anki=info"
    volumes:
      - ankisync-dev-data:/data
    networks:
      leitor-dev:
        aliases: [ankisync-dev]
    ports:
      - "127.0.0.1:${LEITOR_ANKISYNC_HTTP_PORT:-28080}:8080"

  ankisync-dev-tls:
    ulimits:
      core: 0  # no core dumps on the host (kernel core_pattern is global; docs/decisoes.md)
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./server/ankisync-dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./server/ankisync-dev/certs:/certs:ro
    depends_on:
      ankisync-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/health"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 15
    networks:
      leitor-dev:
        aliases: [ankisync-dev-tls]
    ports:
      - "127.0.0.1:${LEITOR_ANKISYNC_TLS_PORT:-28443}:8443"

  # Library sync server (server/library-sync, docs/planos/fase-9a.md) behind the "library" profile, for
  # scripts/library-sync-test.sh only (two app clients against the real server in a container). Test password only.
  library-sync-dev:
    ulimits:
      core: 0  # no core dumps on the host (kernel core_pattern is global; docs/decisoes.md)
    profiles: ["library"]
    build:
      context: server/library-sync
    image: leitor-library-sync-dev
    read_only: true
    environment:
      LIBRARY_SYNC_USER: "leitor"
      LIBRARY_SYNC_PASSWORD: "senha-de-teste-longa"
    volumes:
      - library-sync-dev-data:/data
    networks:
      leitor-dev:
        aliases: [library-sync-dev]

  # C++ runner: only on runner-internal (internal: true, no route out), read-only root, tmpfs /work. The server runs
  # as 10001 and the jobs as 10002 (the image's setpriv entrypoint): CAP_SETUID/CAP_SETGID are the only capabilities,
  # kept only so the server can start jobs as the other uid. Mirrors the VPS (server/compose.leitor.yml).
  runner-dev:
    ulimits:
      core: 0  # no core dumps on the host (kernel core_pattern is global; docs/decisoes.md)
    profiles: ["runner"]
    build:
      context: server/runner
    image: leitor-runner-dev
    init: true # reaps the processes a killed program leaves behind
    read_only: true
    tmpfs:
      - /work:size=64m,mode=1777,exec
      - /tmp:size=16m
    # Starts as root only for the image's setpriv entrypoint, which drops to 10001 (jobs: 10002) at once.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    environment:
      # Throwaway local test token (like the sync server's test password); never used outside this compose file.
      RUNNER_TOKEN: ${LEITOR_RUNNER_DEV_TOKEN:-dev-runner-token}
    networks:
      runner-internal:
        aliases: [runner-dev]

  # The only way in (like Caddy on the VPS): on runner-internal and on leitor-dev, where the tests run.
  runner-dev-proxy:
    ulimits:
      core: 0  # no core dumps on the host (kernel core_pattern is global; docs/decisoes.md)
    profiles: ["runner"]
    image: caddy:2
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./server/runner/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      runner-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 15
    networks:
      runner-internal: {}
      leitor-dev:
        aliases: [runner-dev-proxy]
    ports:
      - "127.0.0.1:${LEITOR_RUNNER_PROXY_PORT:-28090}:8080"

networks:
  leitor-dev:
    name: leitor-dev
  runner-internal:
    name: leitor-runner-internal
    internal: true

volumes:
  library-sync-dev-data:
  ankisync-dev-data:
